{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block title %}Профиль{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card">
            <div class="card-header">
                <h3 class="text-center">Профиль пользователя</h3>
            </div>
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}
                    {{ u_form|crispy }}
                    {{ p_form|crispy }}
                    <button type="submit" class="btn btn-primary w-100 mt-3">Обновить профиль</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
